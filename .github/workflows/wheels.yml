name: Wheels

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          extras: uv
        env:
          CIBW_ARCHS_MACOS: arm64
          CIBW_TEST_COMMAND_MACOS: pytest {project}/tests/test_native_geometry.py {project}/tests/test_gravity_packing.py -x --log-cli-level=INFO

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
