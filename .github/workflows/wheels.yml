name: Wheels

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
        mac_arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          extras: uv
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.mac_arch }}
          CIBW_TEST_COMMAND_MACOS: python {project}/scripts/debug_mac.py {project}/tests && pytest {project}/tests/test_gravity_packing.py

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.mac_arch }}
          path: ./wheelhouse/*.whl
